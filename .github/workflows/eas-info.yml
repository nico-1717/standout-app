name: EAS info
on:
  workflow_dispatch:
jobs:
  info:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build:list --platform ios --limit 60 --json --non-interactive | jq -r '(map(select(.createdAt>"2026-11-01"))|length), (group_by(.status)|map(.[0].status+":"+(length|tostring))|join(" ")), ([.[]|select(.error!=null)|.error.message]|unique|join(" ## "))'
