name: iOS build for TestFlight
# The button: GitHub > Actions > "iOS build for TestFlight" > Run workflow.
# The build itself runs on Expo's servers (EAS); this job only starts it and sends it to TestFlight when ready.
# The Apple signing files and the upload key already live on Expo, so the only secret needed is EXPO_TOKEN.
# (Normally you do not need this: "Phone update" starts a build by itself when the native part changes.)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the Expo token is there
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN is missing (see docs/AGGIORNAMENTI_AUTOMATICI.md)"
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build and send to TestFlight
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
