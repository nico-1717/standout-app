name: iPhone simulator test
# The button: GitHub > Actions > "iPhone simulator test" > Run workflow.
# A Mac in the cloud (free for public repos) builds the app for the iPhone simulator, opens it, taps through
# the flows in the .maestro folder and keeps the screenshots (Artifacts, at the bottom of the run page).
# Nothing here changes the app, the Apple signing or the phone-update channel, and it needs NO secret:
# every run creates its own throw-away test account on the site (named e2e + the run number; not deleted yet).
on:
  workflow_dispatch:
    inputs:
      freshjs:
        description: 'Put the current JavaScript into the saved built app (use with cachekey; no rebuild)'
        required: false
        default: 'false'
      flow:
        description: 'Which flow to run (file name in .maestro, without .yaml). Empty = all of them.'
        required: false
        default: ''
      cachekey:
        description: 'Advanced: reuse the built app saved under this exact cache key. Empty = the key worked out from the code.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: simulator-test
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci

      # The key is worked out once, BEFORE expo prebuild (prebuild rewrites app.json/package.json, so a key worked out
      # again later never matched the one used to restore, and the app was rebuilt every time).
      - name: Work out the key of the built app
        id: appkey
        run: echo "key=simulator-app-${{ hashFiles('src/**', 'assets/**', 'app.json', 'app.config.js', 'package-lock.json', 'package.json') }}" >> "$GITHUB_OUTPUT"

      - name: Reuse the built app if the app code did not change (only the flows did)
        id: appcache
        uses: actions/cache/restore@v4
        with:
          path: built-app
          key: ${{ inputs.cachekey || steps.appkey.outputs.key }}

      - name: Make the iOS project (only on this Mac, never saved in the repo)
        if: steps.appcache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install

      - name: Turn off over-the-air updates in this test build
        if: steps.appcache.outputs.cache-hit != 'true'
        # Otherwise the app would download the live version in the middle of a flow and restart.
        run: |
          PLIST="$(ls ios/*/Supporting/Expo.plist)"
          /usr/libexec/PlistBuddy -c "Set :EXUpdatesEnabled false" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :EXUpdatesEnabled bool false" "$PLIST"

      - name: Install the iOS libraries (CocoaPods)
        if: steps.appcache.outputs.cache-hit != 'true'
        working-directory: ios
        run: pod install

      - name: Build for the simulator
        if: steps.appcache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          WORKSPACE="$(ls -d ios/*.xcworkspace | head -1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          if ! xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" > xcodebuild.log 2>&1; then
            echo "::group::Errors from xcodebuild"
            grep -n -B2 -A12 -E "error:|Error:|\*\* BUILD FAILED|failed with" xcodebuild.log | head -150
            echo "::endgroup::"
            exit 1
          fi
          mkdir -p built-app
          cp -R "$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)" built-app/

      - name: Keep the built app for the next run
        if: steps.appcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: built-app
          key: ${{ steps.appkey.outputs.key }}

      # The native part of the app is the same when only src/ changed, so the JavaScript is bundled again and put
      # inside the cached app (about 3 minutes) instead of building everything again (about 40 minutes).
      - name: Put the current JavaScript into the built app
        if: inputs.freshjs == 'true'
        run: |
          set -eo pipefail
          APP="$(ls -d built-app/*.app | head -1)"
          ls "$APP" | head -40
          echo "PlugIns:"; ls -R "$APP/PlugIns" | head -30
          ENTRY="$(node -e "console.log(require('expo/scripts/resolveAppEntry'))" 2>/dev/null || true)"
          [ -z "$ENTRY" ] && ENTRY="node_modules/expo-router/entry.js"
          npx expo export:embed --eager --platform ios --dev false --minify false --reset-cache \
            --entry-file "$ENTRY" --bundle-output "$RUNNER_TEMP/main.js" --assets-dest "$RUNNER_TEMP/assets"
          HERMESC="node_modules/hermes-compiler/hermesc/osx-bin/hermesc"
          "$HERMESC" -emit-binary -O -out "$APP/main.jsbundle" "$RUNNER_TEMP/main.js"
          codesign --force --sign - "$APP"
          ls -la "$APP/main.jsbundle"

      - name: Start an iPhone simulator and install the app
        run: |
          DEVICE="$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]( Pro)? \(' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          # No keyboard tips, no auto-correct: they swallow letters that Maestro types.
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences KeyboardAutocorrection -bool false
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences KeyboardPrediction -bool false
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences KeyboardCapsLock -bool false
          xcrun simctl spawn "$DEVICE" defaults write com.apple.keyboard.preferences KeyboardShowPredictionBar -bool false
          APP="$(ls -d built-app/*.app | head -1)"
          xcrun simctl install "$DEVICE" "$APP"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the flows
        run: |
          mkdir -p shots
          # A new throw-away account for this run only.
          export E2E_USER="e2e$GITHUB_RUN_ID"
          export E2E_PASS="Zz$(openssl rand -hex 8)!9a"
          echo "::add-mask::$E2E_PASS"
          # The account is made here with the site's API (the iPhone "Strong Password" box blocks typing a new password
          # in the form); the flow then logs in through the app like a real person.
          curl -fsS -o /dev/null -w "register HTTP %{http_code}\n" -X POST "https://nisama.altervista.org/api/v1/auth/register" -H 'Content-Type: application/json' \
            -d "{\"username\":\"$E2E_USER\",\"email\":\"$E2E_USER@users.noreply.github.com\",\"password\":\"$E2E_PASS\",\"password_confirm\":\"$E2E_PASS\",\"accetto\":true,\"device_name\":\"simulator-test\"}"
          if [ -n "${{ inputs.flow }}" ]; then TARGET=".maestro/${{ inputs.flow }}.yaml"; else TARGET=".maestro"; fi
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=300000   # the iPhone test driver can take minutes to start on the Mac
          maestro --device "$DEVICE" test "$TARGET" \
            -e E2E_USER="$E2E_USER" -e E2E_EMAIL="$E2E_USER@users.noreply.github.com" -e E2E_PASS="$E2E_PASS" \
            --test-output-dir shots --format junit --output shots/report.xml

      - name: Keep the iPhone's own log (Live Activity errors)
        if: always()
        run: |
          xcrun simctl spawn "$DEVICE" log show --last 40m --style compact \
            --predicate 'process == "Standout" OR process == "chronod" OR process == "ExpoWidgetsTarget" OR subsystem CONTAINS "ActivityKit" OR subsystem CONTAINS "Activity"' \
            2>/dev/null | tail -c 600000 > shots/device.log || true
          ls -la shots/device.log || true

      - name: Keep the build log if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Publish the screenshots on the branch simulator-shots
        # The Actions artifact cannot be downloaded from where Claude works, a git branch can.
        # Only the pictures and the Maestro log of the throw-away account go there; each run replaces the last one.
        if: always()
        run: |
          rm -rf publish && mkdir publish
          (cd shots && find . -type f \( -name '*.png' -o -name 'maestro.log' -o -name 'device.log' -o -name 'report.xml' \) -print0 | cpio -0pdm ../publish) || true
          cd publish
          git init -q
          git checkout -q -b simulator-shots
          git config user.name "simulator-test"
          git config user.email "simulator-test@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of run $GITHUB_RUN_ID ($GITHUB_SHA)" --allow-empty
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" simulator-shots

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: warn
