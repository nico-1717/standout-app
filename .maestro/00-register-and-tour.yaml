appId: app.standout.mobile
name: Register a test account and look at the main screens
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '.*Sign up.*'
    timeout: 60000
- takeScreenshot: 00-login
- tapOn: '.*Sign up.*'
- extendedWaitUntil:
    visible: 'Create your account'
    timeout: 15000
- tapOn:
    id: reg-username
- inputText: ${E2E_USER}
- tapOn:
    id: reg-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: reg-password
- inputText: ${E2E_PASS}
- tapOn:
    id: reg-password2
- inputText: ${E2E_PASS}
- hideKeyboard
- tapOn:
    id: reg-accept
- takeScreenshot: 01-register-filled
- tapOn: 'Create account'
- extendedWaitUntil:
    visible:
      id: app-tab-bar
    timeout: 60000
- takeScreenshot: 02-home
