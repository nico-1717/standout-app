appId: app.standout.mobile
name: A card with a very long answer scrolls in the viewer
---
- runFlow: common/login.yaml
# The bar scrolls sideways: slide it so that Flashcards shows.
- swipe:
    start: 85%, 95%
    end: 15%, 95%
- tapOn:
    id: bar-flashcards
- takeScreenshot: 10-flashcards-hub
- tapOn:
    id: hub-study-open
# Typing on the simulator can lose letters: type, check the field, and only then press Enter (up to 3 tries).
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: fc-new
      - eraseText: 40
      - inputText: Test subject
      - assertVisible: 'Test subject'
- pressKey: Enter
- takeScreenshot: 11-subject-made
- tapOn: '.*Test subject.*'
- tapOn:
    id: fcd-settings
- takeScreenshot: 11b-view-settings
# "Edit all cards" opens the page where new cards are typed. The sheet is an iOS Modal that Maestro cannot
# see by id or text, so the button is tapped by its place on the screen.
- tapOn:
    point: 50%,73%
- tapOn:
    id: fci-mode-rows
- tapOn:
    id: fci-q-0
- inputText: What is the long answer?
- tapOn:
    id: fci-a-0
- inputText: 'Point 1: the answer goes on with one more sentence so that this card is much longer than the screen. Point 2: the answer goes on with one more sentence so that this card is much longer than the screen. Point 3: the answer goes on with one more sentence so that this card is much longer than the screen. Point 4: the answer goes on with one more sentence so that this card is much longer than the screen. Point 5: the answer goes on with one more sentence so that this card is much longer than the screen. Point 6: the answer goes on with one more sentence so that this card is much longer than the screen. Point 7: the answer goes on with one more sentence so that this card is much longer than the screen. Point 8: the answer goes on with one more sentence so that this card is much longer than the screen. Point 9: the answer goes on with one more sentence so that this card is much longer than the screen. Point 10: the answer goes on with one more sentence so that this card is much longer than the screen. Point 11: the answer goes on with one more sentence so that this card is much longer than the screen. Point 12: the answer goes on with one more sentence so that this card is much longer than the screen. Point 13: the answer goes on with one more sentence so that this card is much longer than the screen. Point 14: the answer goes on with one more sentence so that this card is much longer than the screen. Point 15: the answer goes on with one more sentence so that this card is much longer than the screen. Point 16: the answer goes on with one more sentence so that this card is much longer than the screen. Point 17: the answer goes on with one more sentence so that this card is much longer than the screen. Point 18: the answer goes on with one more sentence so that this card is much longer than the screen. Point 19: the answer goes on with one more sentence so that this card is much longer than the screen. Point 20: the answer goes on with one more sentence so that this card is much longer than the screen. Point 21: the answer goes on with one more sentence so that this card is much longer than the screen. Point 22: the answer goes on with one more sentence so that this card is much longer than the screen. Point 23: the answer goes on with one more sentence so that this card is much longer than the screen. Point 24: the answer goes on with one more sentence so that this card is much longer than the screen. Point 25: the answer goes on with one more sentence so that this card is much longer than the screen.'
- takeScreenshot: 12-card-typed
# The keyboard covers the Save button and the answer box is as tall as its text. A quick flick (short swipe time)
# starting on the tab row (not on a text box, which would only move the cursor) closes the keyboard and keeps
# scrolling by momentum. Each step runs only while Save is hidden; every step has its own screenshot.
- runFlow:
    when:
      notVisible:
        id: fci-save
    commands:
      - swipe:
          start: 50%,31%
          end: 50%,3%
          duration: 120
      - takeScreenshot: 12b-drag-1
- runFlow:
    when:
      notVisible:
        id: fci-save
    commands:
      - swipe:
          start: 94%,85%
          end: 94%,15%
          duration: 120
      - takeScreenshot: 12b-drag-2
- runFlow:
    when:
      notVisible:
        id: fci-save
    commands:
      - swipe:
          start: 50%,31%
          end: 50%,3%
          duration: 120
      - takeScreenshot: 12b-drag-3
- runFlow:
    when:
      notVisible:
        id: fci-save
    commands:
      - swipe:
          start: 50%,24%
          end: 50%,3%
          duration: 120
      - takeScreenshot: 12b-drag-4
- runFlow:
    when:
      notVisible:
        id: fci-save
    commands:
      - swipe:
          start: 6%,85%
          end: 6%,15%
          duration: 120
      - takeScreenshot: 12b-drag-5
- runFlow:
    when:
      notVisible:
        id: fci-save
    commands:
      - swipe:
          start: 94%,85%
          end: 94%,15%
          duration: 120
      - takeScreenshot: 12b-drag-6
- takeScreenshot: 12b-after-drag
- tapOn:
    id: fci-save
- takeScreenshot: 13-card-saved
- tapOn:
    id: fci-close
- takeScreenshot: 14-back-in-deck
# The card list in the deck: the long answer sits in its own scrolling box (max 190 high), as on the website.
# A quick flick inside the answer text must move the text inside the box (the ANSWER label stays), not the page.
- swipe:
    start: 50%,82%
    end: 50%,66%
    duration: 150
- takeScreenshot: 15-list-answer-after-flick
- swipe:
    start: 50%,82%
    end: 50%,66%
    duration: 150
- takeScreenshot: 16-list-answer-after-2nd-flick
# Back in the deck: open the card viewer, turn the card and scroll the long answer.
- tapOn:
    id: fcd-view
- takeScreenshot: 21-viewer-question
- tapOn:
    id: fcd-viewer-flip
- takeScreenshot: 22-viewer-answer-top
# Quick flicks (short swipe time) inside the card; a slow press-and-drag can be read as a long press.
- swipe:
    start: 50%,70%
    end: 50%,30%
    duration: 150
- takeScreenshot: 23-viewer-answer-after-flick
- swipe:
    start: 50%,70%
    end: 50%,30%
    duration: 150
- takeScreenshot: 24-viewer-answer-after-2nd-flick
- swipe:
    start: 50%,75%
    end: 50%,20%
    duration: 150
- takeScreenshot: 25-viewer-answer-after-3rd-flick
