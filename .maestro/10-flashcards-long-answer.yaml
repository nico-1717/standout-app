- takeScreenshot: 12-card-typed
# The keyboard covers the Save button and the answer box is as tall as its text. Dragging the page by its left
# margin (not from a text box, which would only move the cursor) closes the keyboard and scrolls; at most 7 tries (the same step written 7 times, because Maestro cannot combine a loop with a limit).
- runFlow:
    when:
      notVisible:
        id: fci-save
    commands:
      - swipe:
          start: 5.5%,85%
          end: 5.5%,15%
          duration: 600
- runFlow:
    when:
