- takeScreenshot: 12b-after-drag
- tapOn:
    id: fci-save
- takeScreenshot: 13-card-saved
- tapOn:
    id: fci-close
- takeScreenshot: 14-back-in-deck
# Back in the deck: open the card viewer, turn the card and scroll the long answer.
- tapOn:
    id: fcd-view
- takeScreenshot: 21-viewer-question
- tapOn:
