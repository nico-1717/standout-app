appId: app.standout.mobile
name: A card with a very long answer scrolls in the viewer
---
- runFlow: common/login.yaml
# The bar scrolls sideways: slide it so that Flashcards shows.
- swipe:
    start: 85%, 92%
    end: 15%, 92%
- tapOn:
    id: bar-flashcards
- takeScreenshot: 10-flashcards-hub
- tapOn:
    id: hub-study-open
- tapOn:
    id: fc-new
- inputText: Test subject
- pressKey: Enter
- takeScreenshot: 11-subject-made
- tapOn: '.*Test subject.*'
- tapOn:
    id: fcd-settings
- takeScreenshot: 11b-view-settings
# "Edit all cards" opens the page where new cards are typed. The sheet is an iOS Modal that Maestro cannot
# see by id or text, so the button is tapped by its place on the screen.
- tapOn:
    point: 50%,73%
- tapOn:
    id: fci-mode-rows
- tapOn:
    id: fci-q-0
- inputText: What is the long answer?
- tapOn:
    id: fci-a-0
- inputText: 'Point 1: the answer goes on with one more sentence so that this card is much longer than the screen. Point 2: the answer goes on with one more sentence so that this card is much longer than the screen. Point 3: the answer goes on with one more sentence so that this card is much longer than the screen. Point 4: the answer goes on with one more sentence so that this card is much longer than the screen. Point 5: the answer goes on with one more sentence so that this card is much longer than the screen. Point 6: the answer goes on with one more sentence so that this card is much longer than the screen. Point 7: the answer goes on with one more sentence so that this card is much longer than the screen. Point 8: the answer goes on with one more sentence so that this card is much longer than the screen. Point 9: the answer goes on with one more sentence so that this card is much longer than the screen. Point 10: the answer goes on with one more sentence so that this card is much longer than the screen. Point 11: the answer goes on with one more sentence so that this card is much longer than the screen. Point 12: the answer goes on with one more sentence so that this card is much longer than the screen. Point 13: the answer goes on with one more sentence so that this card is much longer than the screen. Point 14: the answer goes on with one more sentence so that this card is much longer than the screen. Point 15: the answer goes on with one more sentence so that this card is much longer than the screen. Point 16: the answer goes on with one more sentence so that this card is much longer than the screen. Point 17: the answer goes on with one more sentence so that this card is much longer than the screen. Point 18: the answer goes on with one more sentence so that this card is much longer than the screen. Point 19: the answer goes on with one more sentence so that this card is much longer than the screen. Point 20: the answer goes on with one more sentence so th