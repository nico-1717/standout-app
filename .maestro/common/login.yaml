# Shared step (not a flow by itself): opens the app and makes sure the run's test account is logged in.
# The iPhone Keychain keeps the login even when the app data is cleared, so a later flow may already be logged in.
appId: app.standout.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: app-tab-bar
    timeout: 25000
    optional: true
- runFlow:
    when:
      visible: 'Email or username'
    commands:
      # Typing on the simulator can lose letters: the whole login is tried up to 3 times.
      # (No "hideKeyboard": on iPhone it taps the screen and hit the "Sign up" link. The Return key sends the form.)
      - retry:
          maxRetries: 3
          commands:
            - tapOn: 'Email or username'
            - eraseText: 60
            - inputText: ${E2E_USER}
            - tapOn: 'Password'
            - eraseText: 60
            - inputText: ${E2E_PASS}
            - pressKey: Enter
            # iOS may ask "Save Password?" after a login, sometimes a few seconds late; it hides the app until answered
            - extendedWaitUntil:
                visible: 'Not Now'
                timeout: 12000
                optional: true
            - tapOn:
                text: 'Not Now'
                optional: true
            - extendedWaitUntil:
                visible:
                  id: app-tab-bar
                timeout: 60000
- extendedWaitUntil:
    visible:
      id: app-tab-bar
    timeout: 30000
