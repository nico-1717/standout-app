appId: app.standout.mobile
name: Every zoom step draws its rows and events at the right height (static check of the UI-thread zoom)
---
- runFlow: common/login.yaml
- tapOn:
    id: bar-planner
- extendedWaitUntil:
    visible:
      id: day-scroll
    timeout: 15000
- takeScreenshot: 70-zoom-start
# The step dial only shows in the list view (or while pinching, which Maestro cannot do): go there from the settings.
- tapOn:
    id: planner-settings
- scrollUntilVisible:
    element:
      id: ps-zoom
- tapOn:
    id: ps-zoom
- tapOn:
    point: 25%, 36%
- tapOn:
    id: ps-done
- extendedWaitUntil:
    visible:
      id: zoom-dial
    timeout: 10000
- takeScreenshot: 71-zoom-dial
- tapOn:
    id: zoom-m5
- takeScreenshot: 72-zoom-m5
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 400
- takeScreenshot: 73-zoom-m5-scrolled
