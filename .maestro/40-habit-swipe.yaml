appId: app.standout.mobile
name: A habit row follows a sideways swipe and the page does not scroll
---
- runFlow: common/login.yaml
- tapOn:
    id: bar-habits
- tapOn:
    id: habit-add
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: habit-name
      - eraseText: 40
      - inputText: Swipe test
      - assertVisible: 'Swipe test'
- pressKey: Enter
- takeScreenshot: 50-habit-form
- tapOn:
    id: habit-save
- extendedWaitUntil:
    visible: '.*Swipe test.*'
    timeout: 10000
- takeScreenshot: 51-habit-before-swipe
# A slow drag to the right along the row: the row must follow the finger and the page must stay where it is.
- swipe:
    start: 15%, 76%
    end: 70%, 79%
    duration: 900
- takeScreenshot: 52-habit-after-swipe
# A quick flick to the right on the same row, slightly slanted: it must tick the habit as done.
- swipe:
    start: 20%, 76%
    end: 60%, 78%
    duration: 120
- takeScreenshot: 53-habit-after-flick
