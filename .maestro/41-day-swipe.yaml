appId: app.standout.mobile
name: The planner day follows a sideways swipe and settles on the next day
---
- runFlow: common/login.yaml
- tapOn:
    id: bar-planner
- extendedWaitUntil:
    visible:
      id: day-scroll
    timeout: 15000
- takeScreenshot: 60-day-today
# A long swipe to the left: the next day must slide in and become the day shown.
- swipe:
    start: 85%, 55%
    end: 15%, 55%
    duration: 700
- extendedWaitUntil:
    visible:
      id: day-scroll
    timeout: 5000
- takeScreenshot: 61-day-next
# A calm swipe to the right: back to today.
- swipe:
    start: 15%, 55%
    end: 80%, 55%
    duration: 500
- extendedWaitUntil:
    visible:
      id: day-scroll
    timeout: 5000
- takeScreenshot: 62-day-back
# A vertical swipe must scroll the hours, not change the day.
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 400
- takeScreenshot: 63-day-scrolled
# A quick flick to the left: the next day again.
- swipe:
    start: 70%, 55%
    end: 35%, 56%
    duration: 140
- extendedWaitUntil:
    visible:
      id: day-scroll
    timeout: 5000
- takeScreenshot: 64-day-flick
