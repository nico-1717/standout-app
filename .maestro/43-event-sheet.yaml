appId: app.standout.mobile
name: The new-event pop-up - when line, duration pill, category menu with suggestions
---
- runFlow: common/login.yaml
- tapOn:
    id: bar-planner
- extendedWaitUntil:
    visible:
      id: planner-add
    timeout: 15000
- tapOn:
    id: planner-add
- extendedWaitUntil:
    visible:
      id: sheet-save
    timeout: 8000
- takeScreenshot: 80-sheet-top
- tapOn:
    id: sheet-duration-pill
- takeScreenshot: 81-sheet-quick-durations
- tapOn:
    id: sheet-allday
- takeScreenshot: 82-sheet-all-day
- tapOn:
    id: sheet-allday
- scrollUntilVisible:
    element:
      id: cat
- takeScreenshot: 83-sheet-category
- tapOn:
    id: cat
- takeScreenshot: 84-sheet-category-menu
