appId: app.standout.mobile
name: Log in with a test account and look at the main screens
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Email or username'
    timeout: 60000
- takeScreenshot: 00-login
# Typing on the simulator can lose letters: the whole login is tried up to 3 times.
- retry:
    maxRetries: 3
    commands:
      - tapOn: 'Email or username'
      - eraseText: 60
      - inputText: ${E2E_USER}
      - tapOn: 'Password'
      - eraseText: 60
      - inputText: ${E2E_PASS}
      - hideKeyboard
      - tapOn:
          text: 'Log in'
          index: 0
      - extendedWaitUntil:
          visible:
            id: app-tab-bar
          timeout: 20000
- takeScreenshot: 02-home
